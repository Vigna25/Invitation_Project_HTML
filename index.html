
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Tejesh & Vigna | Engagement Invitation</title>

  <style>

    /* Global reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #fffaf0;
      font-family: "Times New Roman", Times, serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Main invitation */
    .invitation {
      position: relative;
      width: 100%;
      max-width: 650px;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      container-type: inline-size;
    }

    /* Background image */
    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    /* Common text styling */
    .invitation-text {
      position: absolute;
      left: 4%;
      width: 92%;
      margin: 0;
      text-align: center;
      font-family: "Times New Roman", Times, serif;
      color: #000000;
      z-index: 2;
    }

    /* Invitation paragraph */
    .message {
      top: 35%;
      font-size: clamp(12px, 2.65cqw, 17px);
      line-height: 1.5;
    }

    /* Date */
    .date {
      top: 48.5%;
      font-size: clamp(17px, 4cqw, 26px);
      line-height: 1.3;
      color: #915c02;
      font-weight: bold;
    }

    /* Time */
    .time {
      top: 52.5%;
      font-size: clamp(14px, 3.2cqw, 21px);
      line-height: 1.4;
      font-weight: bold;
    }

    /* Countdown */
    .countdown {
      top: 59%;
      font-size: clamp(16px, 3.8cqw, 25px);
      line-height: 1.6;
      color: #915c02;
      font-weight: bold;
      white-space: nowrap;
    }

    /* Venue */
    .venue {
      top: 67%;
      font-size: clamp(12px, 2.45cqw, 16px);
      line-height: 1.7;
    }

    .venue a {
      color: #915c02;
      font-weight: bold;
      text-decoration: underline;
    }

    /* Lunch */
    .lunch {
      top: 80%;
      font-size: clamp(12px, 2.4cqw, 15px);
      font-weight: bold;
    }


    /* =================================
       MOBILE FULL-SCREEN LAYOUT
       ================================= */

    @media (max-width: 600px) {

      body {
        padding: 0;
        overflow: hidden;
      }

      .invitation {
        width: 100%;
        max-width: none;

        /* Fill available phone screen */
        height: 100vh;
        height: 100svh;
        height: 100dvh;

        aspect-ratio: auto;
      }

      .background {
        width: 100%;
        height: 100%;

        /* Fill screen, crop sides if necessary */
        object-fit: cover;
        object-position: center center;
      }

      /* Invitation paragraph */
      .message {
        top: 35%;
        left: 3%;
        width: 94%;
        font-size: clamp(12px, 3.2vw, 15px);
        line-height: 1.5;
      }

      /* Date */
      .date {
        top: 49%;
        font-size: clamp(20px, 5.3vw, 25px);
      }

      /* Time */
      .time {
        top: 53%;
        font-size: clamp(17px, 4.5vw, 21px);
      }

      /* Countdown */
      .countdown {
        top: 60%;
        font-size: clamp(18px, 4.8vw, 23px);
      }

      /* Venue */
      .venue {
        top: 68%;
        font-size: clamp(13px, 3.4vw, 16px);
        line-height: 1.6;
      }

      /* Lunch */
      .lunch {
        top: 82%;
        font-size: clamp(13px, 3.3vw, 15px);
      }
    }


    /* Smaller phones */
    @media (max-width: 360px) {

      .message {
        font-size: 11px;
      }

      .date {
        font-size: 19px;
      }

      .time {
        font-size: 16px;
      }

      .countdown {
        font-size: 17px;
      }

      .venue {
        font-size: 12px;
      }

      .lunch {
        font-size: 12px;
      }
    }


    /* Desktop and tablet */
    @media (min-width: 601px) {

      body {
        min-height: 100vh;
        padding: 20px;
      }

      .invitation {
        width: min(100%, 650px);
      }

    }

  </style>
</head>

<body>

  <main class="invitation">

    <!-- Background image -->
    <img
      src="Background_Image.png"
      alt="Tejesh and Vigna Engagement Invitation"
      class="background"
    >

    <!-- Invitation message -->
    <p class="invitation-text message">
      <strong>Together with our families,</strong><br>
      we joyfully invite you to celebrate the<br>
      beginning of our forever as we exchange rings<br>
      and begin a beautiful new chapter together.
    </p>

    <!-- Event date -->
    <p class="invitation-text date">
      <strong>20 November 2026</strong>
    </p>

    <!-- Event time -->
    <p class="invitation-text time">
      <strong>@ 9:39 AM</strong>
    </p>

    <!-- Countdown -->
    <p id="countdown" class="invitation-text countdown">
      Loading timer...
    </p>

    <!-- Venue -->
    <p class="invitation-text venue">
      <strong>Venue:</strong> Door-103, Second Floor<br>

      <a
        href="https://maps.app.goo.gl/euv81rATyqHrmnAB9"
        target="_blank"
        rel="noopener noreferrer"
      >
        Sai Prabha Residency
      </a>
    </p>

    <!-- Lunch -->
    <p class="invitation-text lunch">
      Lunch Follows
    </p>

  </main>


  <!-- Countdown functionality -->
  <script>
    TEST_MODE = true
    // Engagement date and time (IST)
    const targetDate = TEST_MODE ? Date.now() + 30 * 1000: new Date("2026-11-20T09:39:00+05:30").getTime();

    // Redirect destination
    const redirectURL = "./final_page.html";

    const countdownElement =
      document.getElementById("countdown");

    let timer;
    let redirectStarted = false;

    function updateCountdown() {

      const now = Date.now();
      const distance = targetDate - now;

      // Event has started
      if (distance <= 0) {

        clearInterval(timer);

        countdownElement.innerHTML =
          "⌛ <strong>The Event has already started!</strong>";

        if (!redirectStarted) {

          redirectStarted = true;

          setTimeout(function () {
            window.location.href = redirectURL;
          }, 3000);

        }

        return;
      }

      // Calculate remaining time
      const days = Math.floor(
        distance / (1000 * 60 * 60 * 24)
      );

      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
      );

      const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) /
        (1000 * 60)
      );

      const seconds = Math.floor(
        (distance % (1000 * 60)) / 1000
      );

      // Display countdown
      countdownElement.innerHTML =
        "⌛ <strong>" +
        days + "d " +
        hours + "h " +
        minutes + "m " +
        seconds + "s" +
        "</strong>";

    }

    // Start countdown
    updateCountdown();

    timer = setInterval(updateCountdown, 1000);

  </script>

</body>
</html>
