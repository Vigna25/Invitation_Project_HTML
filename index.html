<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Engagement_Invitation</title>
  <style>
    body {
      background-image: url('Background_image.png');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* Prevents margin collapse so margin-top always works */
    .timer-wrapper {
      display: flow-root;
      /* Dark background to make gold pop */
      min-height: 200px;
    }

    .countdown-text {
      font-size: 28px;
      line-height: 1.8;
      /* Metallic gold color */
      text-align: center;
      /* Center aligned */
      margin-top: 60px;
      /* Exact top margin */
      margin-bottom: 0;
      /* Zero bottom margin */
    }
  </style>
</head>

<body>
  <p style="margin-top: 215px;
      /* Moves the text down to your desired vertical position */
      margin-bottom: 0px;
      /* Removes all bottom margin */
      text-align: center;
      line-height: 1.3;
      font-size: 17px;">
    <strong>Together with our families,</strong><br />
    we joyfully invite you to celebrate the<br />
    beginning of our forever as we exchange rings <br />
    and begin a beautiful new chapter together.
  </p>

  <p style="margin-top: 30px;
    text-align: center;
    font-size: 25px;
    color: #915c02;
    margin-bottom: 0px;">
    <strong>20 November 2026</strong>
  </p>

  <p style="margin-top: 5px;
    text-align: center;
    font-size: 20px;
    margin-bottom: 0px;">
    <strong>@ 9:39 AM</strong>
  </p>

  <p style="margin-top: 50px;
    text-align: center;
    font-size: 25px;" id="countdown" class="countdown-text">
    Loading timer...
  </p>

  <p style="margin-top: 30px;
    text-align: center;
    font-size: 15.5px;
    margin-bottom: 10px;">
    <strong>Venue:</strong> Door-103, Second Floor<br />
    <a href="https://maps.app.goo.gl/euv81rATyqHrmnAB9">Sai Prabha Residency</a>
  </p>

  <p style="margin-top: 30px;
    text-align: center;
    font-size: 15.5px;
    font-size: 15px;">
    Lunch Follows
  </p>

  <script>
    // 1. Set your target event date and time
    const targetDate = new Date("November 15, 2026 00:46:00").getTime();

    // 2. Set the URL you want to redirect to
    const redirectURL = "./final_page.html";

    const timer = setInterval(function () {
      const now = new Date().getTime();
      const distance = targetDate - now;

      // Check if the timer has reached zero or passed
      if (distance <= 0) {
        clearInterval(timer);

        // Display the new message
        document.getElementById("countdown").innerHTML = "&#8987; The Event has already started";

        // Wait 3 seconds (3000ms) so the user can read the message, then redirect
        setTimeout(function () {
          window.location.href = redirectURL;
        }, 3000);

        return; // Stops the rest of the code from running
      }

      // Time calculations
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      // Update the timer on screen
      document.getElementById("countdown").innerHTML =
        "&#9203; " + days + "d " + hours + "h " + minutes + "m " + seconds + "s";
    }, 1000);
  </script>

</body>
