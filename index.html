<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engagement Invitation</title>
</head>

<body style="
  margin: 0;
  padding: 0;
  background-color: #fffaf0;
  font-family: 'Times New Roman', Times, serif;
">

  <!-- Main invitation container -->
  <div style="
    position: relative;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    aspect-ratio: 2 / 3;
  ">

    <!-- Background image -->
    <img src="Background_Image.png" alt="Tejesh and Vigna Engagement Invitation" style="
        display: block;
        width: 100%;
        max-width: 700px;
        height: auto;
        object-fit: contain;
        /*width: 100%;
        height: 100%;
        object-fit: fill;*/
      ">

    <!-- Invitation message -->
    <p style="
      position: absolute;
      top: 35%;
      left: 4%;
      width: 92%;
      margin: 0;
      text-align: center;
      line-height: 1.3;
      font-size: 17px;
      font-family: 'Times New Roman', Times, serif;
      color: #000000;
    ">
      <strong>Together with our families,</strong><br>
      we joyfully invite you to celebrate the<br>
      beginning of our forever as we exchange rings<br>
      and begin a beautiful new chapter together.
    </p>

    <!-- Event date -->
    <p style="
      position: absolute;
      top: 47.5%;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      font-size: 25px;
      font-family: 'Times New Roman', Times, serif;
      color: #915c02;
    ">
      <strong>20 November 2026</strong>
    </p>

    <!-- Event time -->
    <p style="
      position: absolute;
      top: 50.8%;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      font-size: 20px;
      font-family: 'Times New Roman', Times, serif;
      color: #000000;
    ">
      <strong>@ 9:39 AM</strong>
    </p>

    <!-- Countdown -->
    <p id="countdown" style="
      position: absolute;
      top: 57%;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      font-size: 25px;
      line-height: 1.8;
      font-family: 'Times New Roman', Times, serif;
      color: #915c02;
    ">
      Loading timer...
    </p>

    <!-- Venue -->
    <p style="
      position: absolute;
      top: 66.5%;
      left: 3%;
      width: 94%;
      margin: 0;
      text-align: center;
      font-size: 15.5px;
      line-height: normal;
      font-family: 'Times New Roman', Times, serif;
      color: #000000;
    ">
      <strong>Venue:</strong> Door-103, Second Floor<br>

      <a href="https://maps.app.goo.gl/euv81rATyqHrmnAB9" style="
          color: #915c02;
          font-family: 'Times New Roman', Times, serif;
        ">
        <strong>Sai Prabha Residency</strong>
      </a>
    </p>

    <!-- Lunch -->
    <p style="
      position: absolute;
      top: 73.5%;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      font-size: 17px;
      font-family: 'Times New Roman', Times, serif;
      color: #000000;
    ">
      Lunch Follows
    </p>

  </div>

  <script>

    // Target event date and time
    // Test timestamp retained as requested
    const targetDate =
      new Date("November 15, 2026 01:52:00").getTime();

    // Redirect destination
    const redirectURL = "./final_page.html";

    const countdownElement =
      document.getElementById("countdown");

    let timer;

    function updateCountdown() {

      const now = new Date().getTime();
      const distance = targetDate - now;

      // Event has started
      if (distance <= 0) {

        clearInterval(timer);

        countdownElement.innerHTML =
          "&#8987; <strong>The Event has already started</strong>";

        setTimeout(function () {
          window.location.href = redirectURL;
        }, 3000);

        return;
      }

      // Calculate remaining time
      const days = Math.floor(
        distance / (1000 * 60 * 60 * 24)
      );

      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
      );

      const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) /
        (1000 * 60)
      );

      const seconds = Math.floor(
        (distance % (1000 * 60)) / 1000
      );

      // Display countdown
      countdownElement.innerHTML =
        "&#9203; <strong>" + days + "d " +
        hours + "h " +
        minutes + "m " +
        seconds + "s </strong>";
    }

    // Start countdown immediately
    updateCountdown();

    timer = setInterval(updateCountdown, 1000);

  </script>

</body>

</html>
