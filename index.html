
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tejesh & Vigna | Engagement Invitation</title>

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background-color: #fffaf0;
      font-family: "Times New Roman", Times, serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Main invitation container */
    .invitation {
      position: relative;
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      container-type: inline-size;
    }

    /* Background image */
    .background {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Common text styles */
    .invitation-text {
      position: absolute;
      left: 4%;
      width: 92%;
      margin: 0;
      text-align: center;
      font-family: "Times New Roman", Times, serif;
      color: #000000;
    }

    /* Invitation message */
    .message {
      top: 35%;
      font-size: clamp(10px, 2.65cqw, 17px);
      line-height: 1.5;
    }

    /* Date */
    .date {
      top: 48.5%;
      font-size: clamp(16px, 4cqw, 26px);
      line-height: 1.3;
      color: #915c02;
      font-weight: bold;
    }

    /* Event time */
    .time {
      top: 52.5%;
      font-size: clamp(13px, 3.2cqw, 21px);
      line-height: 1.4;
      font-weight: bold;
    }

    /* Countdown */
    .countdown {
      top: 59%;
      font-size: clamp(14px, 3.8cqw, 25px);
      line-height: 1.6;
      color: #915c02;
      font-weight: bold;
      white-space: nowrap;
    }

    /* Venue */
    .venue {
      top: 67%;
      font-size: clamp(10px, 2.45cqw, 16px);
      line-height: 1.7;
    }

    .venue a {
      color: #915c02;
      font-weight: bold;
      text-decoration: underline;
    }

    /* Lunch */
    .lunch {
      top: 80%;
      font-size: clamp(10px, 2.4cqw, 15px);
      font-weight: bold;
      line-height: 1.5;
    }

    /* Tablet */
    @media (min-width: 481px) and (max-width: 768px) {
      .invitation {
        width: 100%;
      }
    }

    /* Mobile */
    @media (max-width: 480px) {
      body {
        padding: 0;
      }

      .invitation {
        width: 100%;
        max-width: none;
      }

      .message {
        line-height: 1.4;
      }

      .venue {
        line-height: 1.5;
      }
    }

    /* Very small phones */
    @media (max-width: 350px) {
      .message {
        font-size: 2.5cqw;
      }

      .date {
        font-size: 3.7cqw;
      }

      .time {
        font-size: 3cqw;
      }

      .countdown {
        font-size: 3.4cqw;
      }

      .venue {
        font-size: 2.3cqw;
      }

      .lunch {
        font-size: 2.3cqw;
      }
    }

  </style>
</head>

<body>

  <main class="invitation">

    <!-- Background image -->
    <img
      src="Background_Image.png"
      alt="Tejesh and Vigna Engagement Invitation"
      class="background"
    >

    <!-- Invitation message -->
    <p class="invitation-text message">
      <strong>Together with our families,</strong><br>
      we joyfully invite you to celebrate the<br>
      beginning of our forever as we exchange rings<br>
      and begin a beautiful new chapter together.
    </p>

    <!-- Event date -->
    <p class="invitation-text date">
      <strong>20 November 2026</strong>
    </p>

    <!-- Event time -->
    <p class="invitation-text time">
      <strong>@ 9:39 AM</strong>
    </p>

    <!-- Countdown -->
    <p id="countdown" class="invitation-text countdown">
      Loading timer...
    </p>

    <!-- Venue -->
    <p class="invitation-text venue">
      <strong>Venue:</strong> Door-103, Second Floor<br>

      <a
        href="https://maps.app.goo.gl/euv81rATyqHrmnAB9"
        target="_blank"
        rel="noopener noreferrer"
      >
        Sai Prabha Residency
      </a>
    </p>

    <!-- Lunch -->
    <p class="invitation-text lunch">
      Lunch Follows
    </p>

  </main>

  <script>

    // Engagement date and time (IST)
    const targetDate = new Date(
      "2026-11-20T09:39:00+05:30"
    ).getTime();

    // Redirect destination
    const redirectURL = "./final_page.html";

    const countdownElement =
      document.getElementById("countdown");

    let timer;
    let redirectStarted = false;

    function updateCountdown() {

      const now = Date.now();
      const distance = targetDate - now;

      // Event has started
      if (distance <= 0) {

        clearInterval(timer);

        countdownElement.innerHTML =
          "⌛ <strong>The Event has already started!</strong>";

        // Redirect after 3 seconds
        if (!redirectStarted) {

          redirectStarted = true;

          setTimeout(function () {
            window.location.href = redirectURL;
          }, 3000);

        }

        return;
      }

      // Calculate remaining time
      const days = Math.floor(
        distance / (1000 * 60 * 60 * 24)
      );

      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
      );

      const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) /
        (1000 * 60)
      );

      const seconds = Math.floor(
        (distance % (1000 * 60)) / 1000
      );

      // Display countdown
      countdownElement.innerHTML =
        "⌛ <strong>" +
        days + "d " +
        hours + "h " +
        minutes + "m " +
        seconds + "s" +
        "</strong>";

    }

    // Initialize countdown
    updateCountdown();

    // Update every second
    timer = setInterval(updateCountdown, 1000);

  </script>

</body>
</html>
