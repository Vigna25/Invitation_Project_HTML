
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Event Has Started!</title>

  <style>

    /* Global reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #fffaf0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Main invitation */
    .invitation {
      position: relative;
      width: 100%;
      max-width: 650px;
      aspect-ratio: 823 / 1164;
      overflow: hidden;
    }

    /* Background image */
    .late {
      position: absolute;
      inset: 0;

      display: block;
      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center center;
    }

    /* Mobile layout */
    @media (max-width: 600px) {

      body {
        padding: 0;
        overflow-x: hidden;
      }

      .invitation {
        width: min(100vw, calc(100dvh * 823 / 1164));
        max-width: none;
        height: auto;
        aspect-ratio: 823 / 1164;
      }

      .late {
        object-fit: contain;
        object-position: center center;
      }
    }

    /* Smaller phones */
    @media (max-width: 360px) {

      .invitation {
        width: min(100vw, calc(100dvh * 823 / 1164));
      }

    }

    /* Desktop and tablet */
    @media (min-width: 601px) {

      body {
        min-height: 100vh;
        padding: 20px;
      }

      .invitation {
        width: min(100%, 650px);
      }

    }

  </style>
</head>

<body>

  <main class="invitation">

    <img
      src="resized.jpg"
      alt="Oops! You are late! We've already started exchanging rings!"
      class="late"
    >

  </main>

</body>

</html>
