<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Event Has Started!</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fffaf0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .late {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100svh;
      height: 100dvh;

      object-fit: contain;
      object-position: center;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .late {
        width: 100%;
        height: 100vh;
        height: 100svh;
        height: 100dvh;
        object-fit: cover;
      }
    }

  </style>
</head>

<body>

  <img
    src="Oops_You_are_late_Image.png"
    alt="Oops! You are late! We've already started exchanging rings!"
    class="late"
  >

</body>

</html>
