
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Event Has Started!</title>

  <style>
    /* Global reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #fffaf0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Same container dimensions as index.html */
    .invitation {
      position: relative;
      width: 100%;
      max-width: 650px;
      aspect-ratio: 2 / 3;
      overflow: hidden;
    }

    /* Background image */
    .late {
      position: absolute;
      inset: 0;

      display: block;
      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;
    }

    /* Mobile full-screen layout */
    @media (max-width: 600px) {

      body {
        overflow: hidden;
      }

      .invitation {
        width: 100%;
        max-width: none;

        height: 100vh;
        height: 100svh;
        height: 100dvh;

        aspect-ratio: auto;
      }

      .late {
        object-fit: cover;
        object-position: center center;
      }
    }

    /* Smaller phones */
    @media (max-width: 360px) {
      .invitation {
        width: 100%;
      }
    }

    /* Desktop and tablet */
    @media (min-width: 601px) {

      body {
        min-height: 100vh;
        padding: 20px;
      }

      .invitation {
        width: min(100%, 650px);
      }
    }

  </style>
</head>

<body>

  <main class="invitation">

    <img
      src="Oops_You_are_late_Image.png"
      alt="Oops! You are late! We've already started exchanging rings!"
      class="late"
    >

  </main>

  <script>
  window.addEventListener("load", () => {
    const scrollPosition =
      (document.documentElement.scrollHeight -
       window.innerHeight) * 0.50;

    window.scrollTo({
      top: scrollPosition,
      behavior: "instant"
    });
  });
</script>

</body>

</html>
